<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 978 704" width="978" height="704" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Stream Deck button layout</title>
<desc id="d">15-key Stream Deck. Top row: 1 Countdown, 2 Cam 1 + Lyrics, 3 Cam 2 + Lyrics, 4 Cam 1 Clean, 5 Cam 2 Clean. Second row: 6 Full Slide, 7 Sermon Split, 8 Break, 9 End Slate, then empty. Third row: empty, except Publish at the far right, which puts the scene in the preview on air.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
<marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#808080"/></marker>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="frame"><rect width="960" height="540"/></clipPath>
</defs>
