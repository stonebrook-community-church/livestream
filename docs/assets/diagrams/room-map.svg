<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Room map: camera positions</title>
<desc id="d">Top-down schematic. The stage is at the top with the pulpit in the center, the band on the right and the communion table on the floor in front. Cam 1 is at the back center and sees the whole stage. Cam 2 is on the left side (facing the stage) and sees the stage at an angle; its P5 view turns toward the congregation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
<marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#808080"/></marker>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="frame"><rect width="960" height="540"/></clipPath>
</defs>
