<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Program and preview</title>
<desc id="d">Two frames side by side. Left: PROGRAM, on air, showing Scene 4 — Cam 1 Clean on Cam 1 P3, with a thick border and a LIVE label. Right: PREVIEW, not on air yet, showing Scene 7 — Sermon Split on Cam 2 P3, with a NEXT label. Pressing Publish puts the preview on air.</desc>
