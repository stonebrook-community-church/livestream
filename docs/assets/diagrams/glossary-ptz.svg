<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">PTZ: pan, tilt, zoom</title>
<desc id="d">Three panels. Pan: a camera seen from above, with a curved arrow showing it turning left and right. Tilt: a camera seen from the side, with a curved arrow showing it aiming up and down. Zoom: a frame with a smaller dashed frame inside; arrows point inward to show zooming closer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
<marker id="arrow-mid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#808080"/></marker>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="frame"><rect width="960" height="540"/></clipPath>
</defs>
<rect width="1000" height="380" rx="14" fill="#ffffff"/><circle cx="170" cy="170" r="48.0" fill="#f0f0f0" stroke="#808080" stroke-width="2"/><rect x="130.0" y="148.0" width="70.0" height="44.0" rx="8" fill="#1a1a1a"/><rect x="200.0" y="155.0" width="18.0" height="30.0" rx="3" fill="#1a1a1a"/><path d="M224.5,92.2 A95,95 0 0 1 224.5,247.8" stroke="#1a1a1a" stroke-width="3.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="170" y="316" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle" >PAN</text><text x="170" y="346" font-size="17" font-weight="normal" fill="#4d4d4d" text-anchor="middle" >Turn left or right (seen from above)</text><rect x="440.0" y="204.0" width="100.0" height="22.0" rx="4" fill="#4d4d4d"/><rect x="480.0" y="180.0" width="20.0" height="26.0" fill="#808080"/><rect x="445.0" y="142.0" width="80.0" height="44.0" rx="8" fill="#1a1a1a"/><rect x="525.0" y="150.0" width="18.0" height="28.0" rx="3" fill="#1a1a1a"/><path d="M551.1,97.2 A95,95 0 0 1 551.1,242.8" stroke="#1a1a1a" stroke-width="3.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="490" y="316" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle" >TILT</text><text x="490" y="346" font-size="17" font-weight="normal" fill="#4d4d4d" text-anchor="middle" >Aim up or down (seen from the side)</text><rect x="700" y="70" width="240" height="135" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/><rect x="770" y="110" width="100" height="56" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="706" y1="76" x2="764" y2="106" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="934" y1="76" x2="876" y2="106" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="706" y1="199" x2="764" y2="170" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="934" y1="199" x2="876" y2="170" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="820" y="316" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="middle" >ZOOM</text><text x="820" y="346" font-size="17" font-weight="normal" fill="#4d4d4d" text-anchor="middle" >Closer (dashed) or wider (solid)</text>
</svg>
